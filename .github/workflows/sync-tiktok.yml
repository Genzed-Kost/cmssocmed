name: Sync TikTok Analytics

on:
  schedule:
    - cron: '0 4 1 * *'    # Tanggal 1 tiap bulan jam 04:00 UTC → bulanan
    - cron: '0 4 * * 1'    # Tiap Senin jam 04:00 UTC → mingguan
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode sync (monthly / weekly)'
        required: false
        default: 'monthly'
      month:
        description: 'Override bulan target — format YYYY-MM'
        required: false
        default: ''
      week:
        description: 'Override minggu target — format YYYY-W##'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve sync mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.mode }}" ]; then
            echo "SYNC_MODE=${{ inputs.mode }}" >> $GITHUB_ENV
          elif [ "$(date +%u)" = "1" ] && [ "$(date +%d)" != "01" ]; then
            echo "SYNC_MODE=weekly" >> $GITHUB_ENV
          else
            echo "SYNC_MODE=monthly" >> $GITHUB_ENV
          fi
          echo "OVERRIDE_MONTH=${{ inputs.month }}" >> $GITHUB_ENV
          echo "OVERRIDE_WEEK=${{ inputs.week }}"   >> $GITHUB_ENV

      - name: Sync TikTok Stats
        run: node .github/scripts/sync-tiktok.js
        env:
          # Penjaga Harapan
          TIKTOK_CLIENT_KEY_PH:      ${{ secrets.TIKTOK_CLIENT_KEY_PH }}
          TIKTOK_CLIENT_SECRET_PH:   ${{ secrets.TIKTOK_CLIENT_SECRET_PH }}
          TIKTOK_REFRESH_TOKEN_PH:   ${{ secrets.TIKTOK_REFRESH_TOKEN_PH }}
          # 33 Official
          TIKTOK_CLIENT_KEY_33:      ${{ secrets.TIKTOK_CLIENT_KEY_33 }}
          TIKTOK_CLIENT_SECRET_33:   ${{ secrets.TIKTOK_CLIENT_SECRET_33 }}
          TIKTOK_REFRESH_TOKEN_33:   ${{ secrets.TIKTOK_REFRESH_TOKEN_33 }}
          # Jaga Asa
          TIKTOK_CLIENT_KEY_JA:      ${{ secrets.TIKTOK_CLIENT_KEY_JA }}
          TIKTOK_CLIENT_SECRET_JA:   ${{ secrets.TIKTOK_CLIENT_SECRET_JA }}
          TIKTOK_REFRESH_TOKEN_JA:   ${{ secrets.TIKTOK_REFRESH_TOKEN_JA }}

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name  "tiktok-sync[bot]"
          git config user.email "tiktok-sync@penjagaharapan.cms"
          git add data/analytics.json
          git diff --staged --quiet || git commit -m "chore: auto-sync TikTok stats $(date +'%Y-%m') [${SYNC_MODE}]"
          git push
