name: WA Reminder Jam 8 WIB

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 08:00 WIB (UTC+7)
  workflow_dispatch:        # tombol "Run workflow" manual untuk test

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # perlu untuk push remindedDate

    steps:
      - uses: actions/checkout@v4

      - name: Kirim WA Reminder Bank Konten
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
        run: node .github/scripts/send-reminders.js

      - name: Simpan remindedDate ke repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contentBank.json
          git diff --cached --quiet || git commit -m "chore: catat remindedDate $(date -u +%F)"
          git push
