name: Sync YouTube Analytics

on:
  schedule:
    - cron: '0 1 1 * *'   # Tiap tanggal 1 bulan baru jam 01:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Override bulan target (format YYYY-MM, kosongkan = bulan lalu)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync YouTube Stats
        run: node .github/scripts/sync-youtube.js
        env:
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          OVERRIDE_MONTH:     ${{ inputs.month }}

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name  "youtube-sync[bot]"
          git config user.email "youtube-sync@penjagaharapan.cms"
          git add data/analytics.json
          git diff --staged --quiet || git commit -m "chore: auto-sync YouTube stats $(date +'%Y-%m')"
          git push
