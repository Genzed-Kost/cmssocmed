name: Sync YouTube Analytics

on:
  schedule:
    - cron: '0 */8 * * *'      # Live — setiap 8 jam (update views & subs bulan berjalan)
    - cron: '59 16 * * 0'      # Mingguan — Minggu 23:59 WIB (16:59 UTC)
    - cron: '59 16 28-31 * *'  # Kandidat akhir bulan — dicek di script
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode sync (monthly / weekly / live)'
        required: false
        default: 'live'
      period:
        description: 'Override periode (YYYY-MM untuk bulanan, YYYY-Www untuk mingguan)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tentukan mode (schedule vs dispatch)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SYNC_MODE=${{ inputs.mode }}" >> $GITHUB_ENV
            echo "OVERRIDE_PERIOD=${{ inputs.period }}" >> $GITHUB_ENV
          else
            # Cek apakah besok tanggal 1 (= hari ini akhir bulan)
            TOMORROW=$(date -u -d "tomorrow" +%d)
            DAY_OF_WEEK=$(date -u +%u)   # 1=Senin, 7=Minggu
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)

            if [ "$TOMORROW" = "01" ] && [ "$HOUR" = "16" ]; then
              echo "SYNC_MODE=monthly" >> $GITHUB_ENV
            elif [ "$DAY_OF_WEEK" = "7" ] && [ "$HOUR" = "16" ]; then
              echo "SYNC_MODE=weekly" >> $GITHUB_ENV
            else
              echo "SYNC_MODE=live" >> $GITHUB_ENV
            fi
          fi

      - name: Sync YouTube Stats
        run: node .github/scripts/sync-youtube.js
        env:
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name  "youtube-sync[bot]"
          git config user.email "youtube-sync@penjagaharapan.cms"
          git add data/analytics.json
          git diff --staged --quiet || git commit -m "chore: auto-sync YouTube ${SYNC_MODE} $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
