name: Auto-Post Multi Platform

on:
  schedule:
    - cron: '*/15 * * * *'   # cek tiap 15 menit (GitHub bisa telat beberapa menit)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Uji coba saja (tidak memposting, tidak mengubah data)'
        type: boolean
        default: true
      content_id:
        description: 'Proses satu konten saja (ID konten, opsional)'
        type: string
        required: false

# Satu antrean dengan workflow lain yang menulis ke data/ → tidak saling tabrak
concurrency:
  group: cms-data-writer
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
      ONLY_ID: ${{ inputs.content_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pilih konten yang jatuh tempo
        id: claim
        run: |
          if [ -n "$DRY_RUN" ]; then
            node .github/scripts/autopost/run.js claim
          else
            bash .github/scripts/autopost/sync.sh claim
          fi

      - name: Posting ke platform
        if: steps.claim.outputs.count != '0'
        env:
          AUTOPOST_CREDENTIALS: ${{ secrets.AUTOPOST_CREDENTIALS }}
        run: node .github/scripts/autopost/run.js post

      - name: Simpan hasil ke CMS
        if: always() && steps.claim.outputs.count != '0' && env.DRY_RUN == ''
        run: bash .github/scripts/autopost/sync.sh apply
