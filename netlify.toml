[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Proxy semua /api/notion/* → Netlify Function (aman, API key tidak terekspos)
[[redirects]]
  from = "/api/notion/*"
  to   = "/.netlify/functions/notion-proxy/:splat"
  status = 200
  force  = true

# Izinkan embed sebagai iframe di Notion.so
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"
    Access-Control-Allow-Origin = "*"
